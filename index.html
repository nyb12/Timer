<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Timer</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="timer-card" aria-labelledby="app-title">
      <p class="eyebrow">Countdown timer</p>
      <h1 id="app-title">Digital Timer</h1>

      <output id="display" class="display" aria-live="polite">00:00:00</output>
      <p id="status" class="status">Set a duration to start.</p>

      <form id="timer-form" class="inputs">
        <label>
          Hours
          <input id="hours" type="number" min="0" max="23" value="0" inputmode="numeric" />
        </label>
        <label>
          Minutes
          <input id="minutes" type="number" min="0" max="59" value="5" inputmode="numeric" />
        </label>
        <label>
          Seconds
          <input id="seconds" type="number" min="0" max="59" value="0" inputmode="numeric" />
        </label>
      </form>

      <div class="controls" aria-label="Timer controls">
        <button id="start" type="button">Start</button>
        <button id="pause" type="button" disabled>Pause</button>
        <button id="resume" type="button" disabled>Resume</button>
        <button id="snooze" type="button" disabled>Snooze 5m</button>
        <button id="stop" type="button" disabled>Stop</button>
      </div>
    </main>

    <audio id="tick-sound" src="dragon-studio-clock-ticking-sfx-467486.mp3" preload="auto"></audio>
    <script type="module" src="app.js"></script>
  </body>
</html>
